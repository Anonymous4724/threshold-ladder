# Deploys the live feed (worker/worker.js) to Cloudflare whenever the worker
# folder changes on main - the same push that publishes the site. Two secrets
# are set once in the repository's settings (Settings -> Secrets and variables
# -> Actions): CLOUDFLARE_API_TOKEN, made from the "Edit Cloudflare Workers"
# template, and CLOUDFLARE_ACCOUNT_ID, the hex string the dashboard's own URL
# carries. worker/wrangler.toml carries everything else - the worker's name,
# the cron, the KV binding, the workers.dev address - and a deploy replaces
# what is on Cloudflare with what that file says. Secrets set on the dashboard
# are never removed by a deploy; --keep-vars keeps plain variables set there
# too.
name: Deploy the live feed

on:
  push:
    branches: [main]
    paths:
      - "worker/**"
      - ".github/workflows/deploy-worker.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker
          command: deploy --keep-vars
